<template>
    <lightning-modal-header label="Reject Leave Request">
    </lightning-modal-header>

    <lightning-modal-body>
        <p class="slds-m-bottom_medium slds-text-color_weak slds-text-body_regular">
            Please provide a specific reason or feedback for rejecting this leave request. These comments will be visible to the employee.
        </p>

        <lightning-textarea
            label="Manager Comments"
            value={comments}
            placeholder="Explain why this request is being rejected (required)..."
            max-length="255"
            onchange={handleCommentsChange}
            required>
        </lightning-textarea>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            label="Cancel"
            onclick={handleCancel}>
        </lightning-button>

        <lightning-button
            variant="destructive"
            label="Confirm Rejection"
            icon-name="utility:close"
            onclick={handleReject}
            class="slds-m-left_small">
        </lightning-button>
    </lightning-modal-footer>
</template>
