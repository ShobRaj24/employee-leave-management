<template>
 <lightning-card title="Leave Balance" icon-name="standard:calibration">

    <div class="slds-p-around_medium">

        <div class="slds-grid slds-wrap slds-gutters">

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <div class="balance-card">
                    <div class="balance-title">
                        Casual Leave
                    </div>

                    <div class="balance-value">
                        {leaveBalance.Casual_Leave__c}
                    </div>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <div class="balance-card">
                    <div class="balance-title">
                        Sick Leave
                    </div>

                    <div class="balance-value">
                        {leaveBalance.Sick_Leave__c}
                    </div>
                </div>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <div class="balance-card">
                    <div class="balance-title">
                        Earned Leave
                    </div>

                    <div class="balance-value">
                        {leaveBalance.Earned_Leave__c}
                    </div>
                </div>
            </div>

        </div>

    </div>

</lightning-card>
    <lightning-card title="Apply Leave" icon-name="standard:calibration">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Employee"
                value={employeeName}
                readonly>
            </lightning-input>

            <lightning-input
                type="date"
                label="Start Date"
                name="startDate"
                value={leaveRequest.startDate}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                type="date"
                label="End Date"
                name="endDate"
                value={leaveRequest.endDate}
                onchange={handleChange}>
            </lightning-input>

            <lightning-combobox
                label="Leave Type"
                name="leaveType"
                value={leaveRequest.leaveType}
                options={leaveTypeOptions}
                onchange={handleChange}>
            </lightning-combobox>

            <lightning-textarea
                label="Reason"
                name="reason"
                value={leaveRequest.reason}
                onchange={handleChange}>
            </lightning-textarea>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Apply Leave"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>

        </div>

    </lightning-card>


</template>
