<template>
    <!-- Leave Balance Summary -->
    <lightning-card title="Leave Balance Overview" icon-name="standard:calibration" class="slds-m-bottom_medium">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
                <!-- Casual Leave Card -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                    <div class="balance-card casual-card">
                        <div class="slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <span class="card-icon-wrapper casual-icon">
                                    <lightning-icon icon-name="utility:clock" size="small" variant="inverse"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body slds-text-align_left">
                                <div class="balance-title">Casual Leave</div>
                                <div class="balance-value">{casualBalance}</div>
                                <div class="balance-subtitle">Days Available</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sick Leave Card -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                    <div class="balance-card sick-card">
                        <div class="slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <span class="card-icon-wrapper sick-icon">
                                    <lightning-icon icon-name="utility:shield" size="small" variant="inverse"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body slds-text-align_left">
                                <div class="balance-title">Sick Leave</div>
                                <div class="balance-value">{sickBalance}</div>
                                <div class="balance-subtitle">Days Available</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Annual / Earned Leave Card -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_small">
                    <div class="balance-card annual-card">
                        <div class="slds-media slds-media_center">
                            <div class="slds-media__figure">
                                <span class="card-icon-wrapper annual-icon">
                                    <lightning-icon icon-name="utility:event" size="small" variant="inverse"></lightning-icon>
                                </span>
                            </div>
                            <div class="slds-media__body slds-text-align_left">
                                <div class="balance-title">Annual Leave</div>
                                <div class="balance-value">{annualBalance}</div>
                                <div class="balance-subtitle">Days Available</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>

    <!-- Apply for Leave Form -->
    <lightning-card title="Submit Leave Request" icon-name="standard:event">
        <div class="slds-is-relative slds-p-around_medium">
            <!-- Loading Spinner -->
            <template lwc:if={isSubmitting}>
                <lightning-spinner alternative-text="Submitting Leave Request" size="medium"></lightning-spinner>
            </template>

            <div class="form-container">
                <div class="slds-form">
                    <!-- Employee Name -->
                    <div class="slds-form-element slds-m-bottom_medium">
                        <lightning-input
                            label="Employee Name"
                            value={employeeName}
                            readonly>
                        </lightning-input>
                    </div>

                    <!-- Half Day Selection Option -->
                    <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium slds-grid_vertical-align-center">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input
                                type="checkbox"
                                label="Apply for Half Day (0.5 Days)"
                                name="isHalfDay"
                                checked={leaveRequest.isHalfDay}
                                onchange={handleChange}>
                            </lightning-input>
                        </div>
                        <template lwc:if={leaveRequest.isHalfDay}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-radio-group
                                    name="halfDayPeriod"
                                    label="Half Day Period"
                                    options={halfDayPeriodOptions}
                                    value={leaveRequest.halfDayPeriod}
                                    type="button"
                                    required
                                    onchange={handleChange}>
                                </lightning-radio-group>
                            </div>
                        </template>
                    </div>

                    <!-- Date Selection Row -->
                    <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input
                                type="date"
                                label={startDateLabel}
                                name="startDate"
                                value={leaveRequest.startDate}
                                min={todayDate}
                                required
                                onchange={handleChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                            <lightning-input
                                type="date"
                                label="End Date"
                                name="endDate"
                                value={leaveRequest.endDate}
                                min={leaveRequest.startDate}
                                disabled={leaveRequest.isHalfDay}
                                required
                                onchange={handleChange}>
                            </lightning-input>
                        </div>
                    </div>

                    <!-- Live Duration Calculation Preview -->
                    <template lwc:if={durationText}>
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium duration-preview">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon icon-name="utility:info" size="x-small" variant="info" class="slds-m-right_x-small"></lightning-icon>
                                <span class="slds-text-body_regular">
                                    Calculated Duration: <strong class="slds-text-color_success">{durationText}</strong>
                                </span>
                            </div>
                        </div>
                    </template>

                    <template lwc:if={isDateRangeInvalid}>
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                            <span class="slds-assistive-text">error</span>
                            <h2>Start Date cannot be later than End Date.</h2>
                        </div>
                    </template>

                    <!-- Leave Type Selection -->
                    <div class="slds-form-element slds-m-bottom_medium">
                        <lightning-combobox
                            label="Leave Type"
                            name="leaveType"
                            value={leaveRequest.leaveType}
                            placeholder="Select Leave Type"
                            options={leaveTypeOptions}
                            required
                            onchange={handleChange}>
                        </lightning-combobox>
                    </div>

                    <!-- Reason Textarea -->
                    <div class="slds-form-element slds-m-bottom_large">
                        <lightning-textarea
                            label="Reason for Leave"
                            name="reason"
                            value={leaveRequest.reason}
                            placeholder="Please provide a brief reason for your leave request..."
                            max-length="255"
                            required
                            onchange={handleChange}>
                        </lightning-textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="slds-grid slds-grid_align-end slds-gutters_x-small form-actions">
                        <div class="slds-col">
                            <lightning-button
                                label="Reset"
                                variant="neutral"
                                onclick={handleReset}
                                disabled={isSubmitting}>
                            </lightning-button>
                        </div>
                        <div class="slds-col">
                            <lightning-button
                                variant="brand"
                                label="Submit Request"
                                icon-name="utility:send"
                                onclick={handleSubmit}
                                disabled={isSubmitDisabled}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
