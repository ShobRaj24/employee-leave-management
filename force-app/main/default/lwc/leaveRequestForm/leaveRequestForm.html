<template>
    <lightning-card title="Leave Balance">
    <div class="slds-p-horizontal_medium slds-p-vertical_small">
        <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col">
                <strong>Casual Leave:</strong> {leaveBalance.Casual_Leave__c}
             </div>

                <div class="slds-col">
                    <strong>Sick Leave:</strong> {leaveBalance.Sick_Leave__c}
                </div>

                <div class="slds-col">
                    <strong>Earned Leave:</strong> {leaveBalance.Earned_Leave__c}
                </div>
        </div>
    </div>
</lightning-card>
    <lightning-card title="Apply Leave" icon-name="standard:calibration">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Employee"
                value={employeeName}
                readonly>
            </lightning-input>

            <lightning-input
                type="date"
                label="Start Date"
                name="startDate"
                value={leaveRequest.startDate}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                type="date"
                label="End Date"
                name="endDate"
                value={leaveRequest.endDate}
                onchange={handleChange}>
            </lightning-input>

            <lightning-combobox
                label="Leave Type"
                name="leaveType"
                value={leaveRequest.leaveType}
                options={leaveTypeOptions}
                onchange={handleChange}>
            </lightning-combobox>

            <lightning-textarea
                label="Reason"
                name="reason"
                value={leaveRequest.reason}
                onchange={handleChange}>
            </lightning-textarea>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Apply Leave"
                    onclick={handleSubmit}>
                </lightning-button>
            </div>

        </div>

    </lightning-card>

    <lightning-card title="My Leave Requests">

        <lightning-datatable
            key-field="Id"
            data={leaveRequests}
            columns={columns}
            hide-checkbox-column
            onrowaction={handleRowAction}>
        </lightning-datatable>

    </lightning-card>

</template>
